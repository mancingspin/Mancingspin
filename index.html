<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MancingSpin</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    body{background:#000;color:#FFD700;padding:20px;}
    .container{max-width:420px;margin:auto;}
    .card{background:#111;border:2px solid #FFD700;border-radius:20px;padding:15px;margin-bottom:20px;}
    h1,h2{text-align:center;margin-bottom:15px;}
    input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #FFD700;background:#000;color:#fff;}
    button{width:100%;padding:12px;border:none;border-radius:20px;background:#FFD700;color:#000;font-weight:bold;}
    .menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    .item{background:#111;border:1px solid #FFD700;border-radius:15px;padding:18px;text-align:center;}
    #lobby{display:none;}
  </style>
</head>
<body>
  <div class="container">
    <h1>MANCINGSPIN</h1>

    <div class="card">
      <h2>LOGIN</h2>
      <input placeholder="Username">
      <input type="password" placeholder="Password">
      <button onclick="document.getElementById('lobby').style.display='block'">MASUK</button>
    </div>

    <div class="card">
      <h2>DAFTAR AKUN</h2>
      <input placeholder="Nama Lengkap">
      <input placeholder="Email">
      <input placeholder="Nomor WhatsApp">
      <input type="password" placeholder="Password">
      <button>DAFTAR</button>
    </div>

    <div class="card" id="lobby">
      <h2>MANCINGSPIN LOBBY</h2>
      <div class="menu">
        <div class="item">🎮 Game</div>
        <div class="item">🎁 Promo</div>
        <div class="item">🏆 Event</div>
        <div class="item">💬 Live Chat</div>
        <div class="item">⭐ Bonus</div>
        <div class="item">⚙ Pengaturan</div>
        <div class="item">📰 Berita</div>
        <div class="item">🚪 Keluar</div>
      </div>
    </div>
  </div>
</body>
</html>
